services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: insightai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d insightai"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/insightai
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      FRONTEND_ORIGIN: http://localhost:5173
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.5-flash}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    depends_on:
      db: {condition: service_healthy}
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    depends_on: [backend]
    ports: ["5173:80"]
volumes:
  postgres_data:
